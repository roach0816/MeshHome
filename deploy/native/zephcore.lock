#
# ZephCore (https://github.com/liquidraver/ZephCore, MIT licence) is a port of the MeshCore
# firmware that runs as a Linux program and serves the MeshCore companion protocol on TCP
# port 5000. Its Linux builds need glibc 2.38 or newer (Debian 13 / Raspberry Pi OS 13).
