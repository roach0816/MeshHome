# TEMPLATE ONLY — never commit real values. Create the real Secret by hand:
#   PW=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
#   kubectl -n meshhome create secret generic meshhome-db --from-literal=POSTGRES_PASSWORD="$PW"
# The password must be URL-safe because it is embedded in DATABASE_URL.
# Keep a copy in your password manager: restoring a backup needs it.
apiVersion: v1
kind: Secret
metadata:
  name: meshhome-db
  namespace: meshhome
type: Opaque
stringData:
  POSTGRES_PASSWORD: <URL_SAFE_RANDOM_PASSWORD>
