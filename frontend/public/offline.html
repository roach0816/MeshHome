<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <title>MeshHome</title>
    <!-- Shown by the service worker (sw.js) when the server can't be reached. Self-contained. -->
    <style>
      :root {
        --bg: #f6f6f7;
        --surface: #ffffff;
        --ink: #16181d;
        --muted: #5f6470;
        --line: #e3e4e8;
        --accent: #0f766e;
        --accent-fg: #ffffff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --surface: #161920;
          --ink: #e8eaee;
          --muted: #9aa1ad;
          --line: #2a2f3a;
          --accent: #2dd4bf;
          --accent-fg: #06201d;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 26rem;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 24px;
      }
      img {
        width: 48px;
        height: 48px;
        border-radius: 12px;
      }
      h1 {
        font-size: 1.15rem;
        margin: 12px 0 4px;
      }
      p {
        color: var(--muted);
        margin: 0 0 16px;
      }
      button {
        min-height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: var(--accent-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Can't reach your MeshHome server</h1>
      <p>
        Check that this device is on your home network (or your VPN) and that the server is running. Messages keep
        arriving at the server meanwhile.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
