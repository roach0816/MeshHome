[project]
name = "meshhome"
version = "1.0.14"
description = "Self-hosted web inbox for a MeshCore Ethernet companion radio"
requires-python = ">=3.11"  # Raspberry Pi OS Bookworm ships 3.11; Debian Trixie 3.13
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.31",
  "alembic>=1.20",
  "pydantic-settings>=2.15",
  "argon2-cffi>=25.1",
  "meshcore==2.3.14",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "httpx>=0.28", "ruff>=0.16"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501", "ASYNC109", "ASYNC240"]  # formatter owns line length
